<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Krishti AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                🤖 <span>Krishti AI</span>
            </div>

            <button class="new-chat">
                + New Chat
            </button>

            <div class="menu">
                <div>💬 Chats</div>
                <div>💻 Developer</div>
                <div>📄 Documents</div>
                <div>🖼️ Images</div>
                <div>🌐 Web Search</div>
            </div>

            <div class="sidebar-bottom">
                ⚙️ Settings
            </div>

        </aside>


        <!-- Main Chat Area -->
        <main class="chat-area">

            <header class="topbar">
                <h2>Krishti AI</h2>
                <span>AI Assistant</span>
            </header>


            <section class="welcome">

                <div class="robot">
                    🤖
                </div>

                <h1>Hello! I'm Krishti AI</h1>

                <p>
                    Your intelligent AI assistant
                </p>


                <div class="quick-actions">

                    <button>💻 Write Code</button>

                    <button>📄 Analyse Document</button>

                    <button>🌐 Search Web</button>

                    <button>💡 Get Ideas</button>

                </div>

            </section>


            <!-- Message Input -->

            <div class="input-area">

                <input
                    type="text"
                    placeholder="Ask Krishti AI anything..."
                >

                <button class="voice">🎤</button>

                <button class="send">➤</button>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
